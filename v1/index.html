<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plantão de Redes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600;75..100,800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: fila de chamados à esquerda (vira faixa no celular) + mesa de trabalho: chamado → topologia → console multi-equipamento → debriefing */
:root{
  --bg:#eef1f0; --panel:#ffffff; --ink:#15201f; --mute:#5d6b69; --line:#d6dedc;
  --accent:#0e7c6b; --accent-ink:#ffffff; --accent-soft:#dcefeb;
  --term:#0f1a1c; --term-ink:#d7e6e3; --term-dim:#7f9995; --term-note:#f2c46d; --term-ok:#7fd8a6; --term-bad:#ff8f80; --term-pr:#6fd3c4;
  --p1:#b42318; --p1s:#fde7e4; --p2:#b45309; --p2s:#fdf0dc; --p3:#3b6fb0; --p3s:#e3ecf8;
  --ok:#1f7a45; --oks:#e0f2e8;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111817; --panel:#18211f; --ink:#e3ebe9; --mute:#9aaba8; --line:#2c3836;
  --accent:#3cc2ab; --accent-ink:#06201b; --accent-soft:#16332e;
  --term:#0a1112; --p1:#ff8f80; --p1s:#3a1c18; --p2:#f0b35e; --p2s:#35270f; --p3:#8db7ef; --p3s:#1a2738;
  --ok:#7fd8a6; --oks:#163323; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111817; --panel:#18211f; --ink:#e3ebe9; --mute:#9aaba8; --line:#2c3836;
  --accent:#3cc2ab; --accent-ink:#06201b; --accent-soft:#16332e;
  --term:#0a1112; --p1:#ff8f80; --p1s:#3a1c18; --p2:#f0b35e; --p2s:#35270f; --p3:#8db7ef; --p3s:#1a2738;
  --ok:#7fd8a6; --oks:#163323; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.fila{border-right:1px solid var(--line);background:var(--panel);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.marca b{display:block;font:800 1.7rem/1 var(--display);font-stretch:80%;letter-spacing:-.01em}
.marca span{font-size:.85rem;color:var(--mute)}
.prog{font:600 .8rem var(--mono);color:var(--mute)}
.prog i{display:block;height:6px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}
.prog i em{display:block;height:100%;background:var(--accent);transition:width .4s}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lista button{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:9px 10px;cursor:pointer;display:grid;gap:3px}
.lista button:hover{background:var(--bg)}
.lista button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lista .l1{display:flex;gap:8px;align-items:center;font:600 .72rem var(--mono);color:var(--mute)}
.lista .l2{font-weight:600;font-size:.93rem;line-height:1.3}
.lista .ok{margin-left:auto;color:var(--ok)}
.pri{padding:1px 7px;border-radius:99px;font:600 .7rem var(--mono)}
.pri.P1{background:var(--p1s);color:var(--p1)} .pri.P2{background:var(--p2s);color:var(--p2)} .pri.P3{background:var(--p3s);color:var(--p3)}
.tag{font:600 .7rem var(--mono);color:var(--accent)}
main{padding-block:24px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.mesa{max-width:900px;margin:0 auto;display:grid;gap:18px}
.chamado{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:10px}
.cab{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font:600 .78rem var(--mono);color:var(--mute)}
h1{font:800 clamp(1.5rem,3.6vw,2.2rem)/1.1 var(--display);font-stretch:85%;margin:0;text-wrap:balance}
.desc{margin:0;max-width:68ch}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 16px;font-size:.9rem}
.meta div{min-width:0} .meta b{display:block;font:600 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.topo{background:var(--bg);border-radius:10px;padding:12px 14px;font:400 .8rem/1.5 var(--mono);overflow-x:auto;white-space:pre;margin:0}
.obj{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:.93rem}
.obj b{color:var(--accent)}
.console{background:var(--term);border-radius:14px;overflow:hidden;display:grid;color:var(--term-ink)}
.abas{display:flex;flex-wrap:wrap;gap:4px;padding:8px 8px 0;background:#ffffff0a}
.abas button{background:none;border:0;border-radius:8px 8px 0 0;padding:7px 12px;cursor:pointer;color:var(--term-dim);font:600 .82rem var(--mono)}
.abas button[aria-pressed="true"]{background:var(--term);color:var(--term-ink)}
.abas small{display:block;font-weight:400;font-size:.68rem}
.tela{height:340px;overflow-y:auto;padding:12px 14px;font:400 .84rem/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.tela .cmd{color:var(--term-ink)} .tela .pr{color:var(--term-pr)}
.tela .out{color:#c3d3d0} .tela .note{color:var(--term-note)} .tela .sys{color:var(--term-dim);font-style:italic}
.tela .good{color:var(--term-ok)} .tela .bad{color:var(--term-bad)}
.linha{display:flex;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid #ffffff14}
.linha label{font:600 .84rem var(--mono);color:var(--term-pr);white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.linha input{flex:1;min-width:0;background:transparent;border:0;outline:0;font:400 .9rem var(--mono);color:var(--term-ink);padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.chips button{background:#ffffff12;border:1px solid #ffffff1f;color:var(--term-ink);border-radius:7px;padding:4px 9px;font:400 .76rem var(--mono);cursor:pointer}
.chips button:hover{border-color:var(--term-pr)}
.chips span{font:600 .7rem var(--mono);color:var(--term-dim);align-self:center}
.acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.dicas{display:grid;gap:8px}
.dica{background:var(--p2s);border-radius:10px;padding:10px 14px;font-size:.93rem}
.dica b{color:var(--p2);font:600 .74rem var(--mono);display:block}
.debrief{background:var(--panel);border:2px solid var(--ok);border-radius:14px;padding:18px 20px;display:grid;gap:12px}
.debrief h2{margin:0;font:800 1.4rem var(--display);font-stretch:85%;color:var(--ok)}
.debrief h3{margin:4px 0 0;font:600 .74rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.debrief p{margin:0;max-width:70ch}
.debrief .fala{background:var(--oks);border-radius:10px;padding:12px 14px;font-style:italic}
.estrelas{font:600 .9rem var(--mono);color:var(--p2)}
code{font:400 .86em var(--mono);background:var(--accent-soft);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.como{font-size:.88rem;color:var(--mute)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .fila{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .lista{grid-auto-flow:column;grid-auto-columns:minmax(200px,70%);overflow-x:auto;padding-bottom:4px}
  .tela{height:300px}
  .chamado,.debrief{padding:16px}
}
</style>

<div class="app">
  <aside class="fila">
    <div class="marca"><b>Plantão de Redes</b><span>Fila de chamados para treinar na prática</span></div>
    <div class="prog" id="prog"></div>
    <ul class="lista" id="lista"></ul>
    <p class="como">Cada chamado é um defeito de verdade numa rede de hospital. Investigue com comandos, ache a causa, corrija e prove que voltou. Digite <code>ajuda</code> em qualquer equipamento.</p>
  </aside>
  <main><div class="mesa">
    <section class="chamado" aria-live="polite">
      <div class="cab"><span id="num"></span><span class="pri" id="pri"></span><span class="tag" id="area"></span></div>
      <h1 id="titulo"></h1>
      <p class="desc" id="desc"></p>
      <div class="meta" id="meta"></div>
      <pre class="topo" id="topo"></pre>
      <div class="obj" id="obj"></div>
    </section>
    <div class="console">
      <div class="abas" id="abas"></div>
      <div class="tela" id="tela" role="log"></div>
      <form class="linha" id="form"><label for="cmd" id="prompt"></label><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="digite um comando"></form>
      <div class="chips" id="chips"></div>
    </div>
    <div class="acoes">
      <button class="btn sec" id="bDica" type="button">Pedir dica</button>
      <button class="btn sec" id="bReset" type="button">Recomeçar chamado</button>
      <span class="como" id="aviso"></span>
    </div>
    <div class="dicas" id="dicas"></div>
    <section class="debrief" id="deb" hidden></section>
  </div></main>
</div>

<script>
/* ---------- utilidades de saída ---------- */
const nl='\n';
function winPing(ip,res){
  let h=`Disparando ${ip} com 32 bytes de dados:`+nl;
  if(res==='ok') return h+[1,2,1,1].map(t=>`Resposta de ${ip}: bytes=32 tempo=${t}ms TTL=${ip.startsWith('8.')?117:63}`).join(nl)+nl+nl+`Estatísticas do Ping para ${ip}:`+nl+`    Pacotes: Enviados = 4, Recebidos = 4, Perdidos = 0 (0% de perda)`;
  if(res==='lento') return h+`Resposta de ${ip}: bytes=32 tempo=812ms TTL=255`+nl+'Esgotado o tempo limite do pedido.'+nl+`Resposta de ${ip}: bytes=32 tempo=1430ms TTL=255`+nl+'Esgotado o tempo limite do pedido.'+nl+nl+`    Pacotes: Enviados = 4, Recebidos = 2, Perdidos = 2 (50% de perda)`;
  if(res==='inac') return h+[1,2,3,4].map(()=>`Resposta de ${res==='inac'?'10.10.20.55':ip}: Host de destino inacessível.`).join(nl);
  if(res==='nome') return `A solicitação ping não pôde encontrar o host ${ip}. Verifique o nome e tente novamente.`;
  return h+[1,2,3,4].map(()=>'Esgotado o tempo limite do pedido.').join(nl)+nl+nl+`    Pacotes: Enviados = 4, Recebidos = 0, Perdidos = 4 (100% de perda)`;
}
function iosPing(ip,ok){
  return 'Type escape sequence to abort.'+nl+`Sending 5, 100-byte ICMP Echos to ${ip}, timeout is 2 seconds:`+nl+(ok?'!!!!!'+nl+'Success rate is 100 percent (5/5), round-trip min/avg/max = 1/1/2 ms'+nl+'» "!" = resposta recebida. 5 de 5: caminho funcionando.':'.....'+nl+'Success rate is 0 percent (0/5)'+nl+'» "." = sem resposta. Nenhum dos 5 pacotes voltou.');
}
function normIf(s){
  s=s.toLowerCase().replace(/\s+/g,'');
  let m=s.match(/^(gigabitethernet|gig|gi|g)(\d+\/\d+\/\d+)$/); if(m) return 'Gi'+m[2];
  m=s.match(/^(port-channel|po)(\d+)$/); if(m) return 'Po'+m[2];
  return null;
}

/* ---------- casos ---------- */
const CASOS=[];
const WR={r:/^(wr(ite)?( mem(ory)?)?|copy run(ning-config)? start(up-config)?)$/,f:()=>'Building configuration...'+nl+'[OK]'+nl+'» Configuração salva. Sem isso, um reinício do switch desfaz a sua mudança.'};
const DOIF={r:/^(description .*|no shut(down)?|switchport mode access)$/,m:'if',f:()=>''};
const PCAJ=['ipconfig','ipconfig /all','ping <ip ou nome>','tracert <ip>','ipconfig /renew'];

/* 1 — gateway errado */
CASOS.push({id:'gw',num:'INC-24817',pri:'P2 · alta',area:'Princípios · PC',
titulo:'Recepção do PS sem internet e sem sistema',
desc:'"Trocaram meu computador hoje de manhã e desde então nada abre. Nem o sistema, nem a internet." O técnico de campo configurou a máquina nova copiando os dados de uma planilha antiga.',
meta:[['Solicitante','Recepção do Pronto-Socorro'],['Equipamento','PC-RECEP01'],['Documentação da rede','VLAN 20 · 10.10.20.0/24 · gateway 10.10.20.1 · DHCP ativo']],
topo:'PC-RECEP01 ──── switch do andar ──── gateway 10.10.20.1 ──── FortiGate ──── Internet\n(10.10.20.55)                          (VLAN 20)',
obj:'descobrir por que o PC não sai da própria rede, corrigir e provar com <code>ping 8.8.8.8</code>.',
init:()=>({dhcp:false}),
devs:[{id:'pc',nome:'PC-RECEP01',host:'Windows 11',tipo:'pc',user:'recepcao',ajuda:[...PCAJ,'arp -a'],regras:[
 {r:/^ipconfig( \/all)?$/,f:(s,m)=>{const all=!!m[1];const ip=s.dhcp?'10.10.20.87':'10.10.20.55',gw=s.dhcp?'10.10.20.1':'10.10.20.254';
  return 'Adaptador Ethernet Ethernet:'+nl+(all?`   DHCP Habilitado. . . . . . . . . . : ${s.dhcp?'Sim':'Não'}`+nl:'')+`   Endereço IPv4. . . . . . . . . . . : ${ip}`+nl+'   Máscara de Sub-rede . . . . . . . . : 255.255.255.0'+nl+`   Gateway Padrão. . . . . . . . . . . : ${gw}`+(all?nl+'   Servidores DNS. . . . . . . . . . . : 10.10.1.10':'')+nl+'» Gateway = a "porta de saída" da rede. Todo tráfego para fora de 10.10.20.x vai para ele.'}},
 {r:/^ping (\S+)$/,f:(s,m)=>{const ip=m[1];
  if(ip==='10.10.20.1') return winPing(ip,'ok')+nl+'» O gateway correto responde. Então o cabo, a porta e a VLAN estão bons.';
  if(ip==='10.10.20.254') return winPing(ip,'to')+nl+'» Ninguém responde nesse endereço.';
  if(/^(8\.8\.8\.8|google\.com|mv\.hvc\.local|10\.10\.1\.\d+)$/.test(ip)){
   if(s.dhcp) return {o:winPing(ip,'ok')+nl+'✔ Saiu da rede local. Chamado resolvido.',solve:true};
   return winPing(ip,'inac')+nl+'» "Host de destino inacessível" vindo do próprio PC: ele nem conseguiu entregar o pacote ao gateway.';}
  return winPing(ip,'to');}},
 {r:/^tracert (\S+)$/,f:(s,m)=>s.dhcp?`Rastreando a rota para ${m[1]}`+nl+'  1    <1 ms    <1 ms    <1 ms  10.10.20.1'+nl+'  2     1 ms     1 ms     1 ms  10.10.0.1'+nl+'  3     6 ms     5 ms     6 ms  200.160.2.1'+nl+'Rastreamento concluído.':`Rastreando a rota para ${m[1]}`+nl+'  1  10.10.20.55  relatórios: Host de destino inacessível.'+nl+'Rastreamento concluído.'+nl+'» Parou no salto 1, ou seja, antes do gateway.'},
 {r:/^arp -a$/,f:s=>'Interface: '+(s.dhcp?'10.10.20.87':'10.10.20.55')+' --- 0xb'+nl+'  Endereço IP           Endereço físico       Tipo'+nl+'  10.10.20.1            00-09-0f-aa-20-01     dinâmico'+nl+'  10.10.20.255          ff-ff-ff-ff-ff-ff     estático'+nl+'» ARP traduz IP em endereço físico (MAC). Repare que não existe nenhuma entrada para 10.10.20.254.'},
 {r:/^netsh int(erface)? ip(v4)? set address .*dhcp$/,f:s=>{s.dhcp=true;return 'Ok.'+nl+'» Adaptador voltou para DHCP e recebeu IP, máscara e gateway do servidor.'}},
 {r:/^netsh int(erface)? ip(v4)? set address .*static .*10\.10\.20\.1$/,f:s=>{s.dhcp=true;return 'Ok.'+nl+'» Gateway corrigido manualmente. Funciona, mas o padrão desta rede é DHCP.'}},
 {r:/^ipconfig \/renew$/,f:s=>s.dhcp?'Adaptador Ethernet Ethernet:'+nl+'   Endereço IPv4. . . . . . . . . . . : 10.10.20.87'+nl+'   Gateway Padrão. . . . . . . . . . . : 10.10.20.1':'Ocorreu um erro ao renovar a interface Ethernet: o DHCP não está habilitado neste adaptador.'+nl+'» O IP foi digitado à mão (estático), então o DHCP não age aqui.'},
]}],
dicas:['Comece pelo que o PC acha que é: <code>ipconfig /all</code>. Compare com a documentação do chamado.','O gateway configurado é 10.10.20.254, mas a documentação diz 10.10.20.1. Teste os dois com <code>ping</code>.','Volte o adaptador para DHCP: <code>netsh interface ip set address "Ethernet" dhcp</code>. Depois teste <code>ping 8.8.8.8</code>.'],
causa:'IP estático copiado de planilha antiga com gateway 10.10.20.254, que não existe. O PC falava com a própria rede, mas não tinha por onde sair.',
conceito:'Para falar com outra rede o PC entrega o pacote ao gateway. Se o gateway estiver errado, tudo dentro da VLAN funciona e tudo fora falha. O teste que separa as camadas: ping no gateway correto (rede local ok) e ping para fora (roteamento).',
fala:'"Fiz o ipconfig e vi que o gateway não batia com a documentação. Confirmei com ping que o gateway certo respondia e o configurado não. Voltei a máquina para DHCP e validei com ping externo."'});

/* 2 — DNS */
CASOS.push({id:'dns',num:'INC-24822',pri:'P3 · média',area:'Princípios · PC',
titulo:'"A internet caiu", mas o ramal funciona',
desc:'Faturista diz que nenhum site e nem o sistema MV abrem. O telefone IP na mesma mesa funciona normal. Outros PCs do setor estão ok.',
meta:[['Solicitante','Faturamento'],['Equipamento','PC-FAT02'],['Documentação da rede','DNS do hospital: 10.10.1.10. O antigo 10.10.1.250 foi desligado na migração do mês passado.']],
topo:'PC-FAT02 ──── gateway 10.10.30.1 ──┬── DNS 10.10.1.10 (ativo)\n                                    ├── DNS 10.10.1.250 (desligado)\n                                    └── MV: mv.hvc.local = 10.10.1.40',
obj:'descobrir por que nomes não funcionam, corrigir e provar com <code>ping mv.hvc.local</code>.',
init:()=>({dns:'10.10.1.250'}),
devs:[{id:'pc',nome:'PC-FAT02',host:'Windows 11',tipo:'pc',user:'faturamento',ajuda:[...PCAJ.slice(0,4),'nslookup <nome>','nslookup <nome> <servidor>','ipconfig /flushdns'],regras:[
 {r:/^ipconfig( \/all)?$/,f:(s,m)=>'Adaptador Ethernet Ethernet:'+nl+(m[1]?'   DHCP Habilitado. . . . . . . . . . : Não'+nl:'')+'   Endereço IPv4. . . . . . . . . . . : 10.10.30.42'+nl+'   Máscara de Sub-rede . . . . . . . . : 255.255.255.0'+nl+'   Gateway Padrão. . . . . . . . . . . : 10.10.30.1'+(m[1]?nl+`   Servidores DNS. . . . . . . . . . . : ${s.dns}`:nl+'» O ipconfig simples não mostra o DNS. Use ipconfig /all.')},
 {r:/^ping (\S+)$/,f:(s,m)=>{const x=m[1],ok=s.dns==='10.10.1.10';
  if(/^\d+\.\d+\.\d+\.\d+$/.test(x)) return x==='10.10.1.250'?winPing(x,'to')+nl+'» Esse servidor não responde.':winPing(x,'ok')+(x==='8.8.8.8'?nl+'» Por IP a internet funciona. Então a rede está de pé.':'');
  if(!ok) return winPing(x,'nome')+nl+'» O PC não conseguiu traduzir o nome em IP.';
  const ip=x.includes('hvc.local')?'10.10.1.40':'142.250.79.46';
  return {o:winPing(ip,'ok').replace('Disparando '+ip,'Disparando '+x+' ['+ip+']')+nl+'✔ Nome resolvido. Chamado resolvido.',solve:true};}},
 {r:/^nslookup (\S+)( (\S+))?$/,f:(s,m)=>{const srv=m[3]||s.dns;
  if(srv==='10.10.1.250') return 'DNS request timed out.'+nl+'    timeout was 2 seconds.'+nl+'Servidor:  UnKnown'+nl+'Address:  10.10.1.250'+nl+'*** Tempo limite de solicitação esgotado'+nl+'» O servidor DNS que o PC usa não responde.';
  return 'Servidor:  dc01.hvc.local'+nl+'Address:  10.10.1.10'+nl+nl+'Nome:    '+m[1]+nl+'Address:  '+(m[1].includes('hvc.local')?'10.10.1.40':'142.250.79.46')+(m[3]&&s.dns!=='10.10.1.10'?nl+'» Perguntando direto ao servidor certo, resolve. O problema está no DNS configurado no PC.':'');}},
 {r:/^ipconfig \/flushdns$/,f:()=>'Configuração de IP do Windows'+nl+'Cache do DNS Resolver liberado.'+nl+'» Limpar o cache não adianta se o servidor DNS configurado está errado.'},

/* ---------- motor ---------- */
const $=id=>document.getElementById(id);
let P={}; try{P=JSON.parse(localStorage.getItem('plantao-redes'))||{}}catch(e){P={}}
function salvar(){try{localStorage.setItem('plantao-redes',JSON.stringify(P))}catch(e){}}
let R=null; // estado do chamado aberto

function abrir(i){
  const c=CASOS[i];
  R={i,c,st:c.init?c.init():{},dev:c.devs[0].id,d:{},log:{},hist:[],hp:0,dicas:0,feito:false};
  c.devs.forEach(d=>{R.d[d.id]={mode:'exec',ifc:null,ctx:[]};R.log[d.id]=[]});
  c.devs.forEach(d=>sys(d.id,`Conectado em ${d.nome} (${d.host}). Digite "ajuda" para ver comandos de diagnóstico.`));
  $('num').textContent=c.num; $('pri').textContent=c.pri; $('pri').className='pri '+c.pri.split(' ')[0];
  $('area').textContent=c.area; $('titulo').textContent=c.titulo; $('desc').textContent=c.desc;
  $('meta').innerHTML=c.meta.map(([k,v])=>`<div><b>${k}</b>${v}</div>`).join('');
  $('topo').textContent=c.topo; $('obj').innerHTML='<b>Seu objetivo:</b> '+c.obj;
  $('dicas').innerHTML=''; $('deb').hidden=true; $('aviso').textContent='';
  try{localStorage.setItem('plantao-ultimo',String(i))}catch(e){}
  lista(); abas(); desenha(); atualizaDica();
}
function devAtual(){return R.c.devs.find(d=>d.id===R.dev)}
function prompt_(d){
  const s=R.d[d.id];
  if(d.prompt) return d.prompt(R.st,s);
  if(d.tipo==='ios') return d.host+(s.mode==='conf'?'(config)#':s.mode==='if'?'(config-if)#':'#');
  if(d.tipo==='pc') return 'C:\\Users\\'+d.user+'>';
  if(d.tipo==='linux') return 'root@'+d.host+':~#';
  if(d.tipo==='fgt') return d.host+(s.ctx.length?' ('+s.ctx[s.ctx.length-1]+')':'')+' #';
  return '>';
}
function push(dev,cls,txt){R.log[dev].push([cls,txt])}
function sys(dev,t){push(dev,'sys',t)}
function saida(dev,t){
  if(!t) return;
  t.split(nl).forEach(l=>{
    if(l.startsWith('» ')) push(dev,'note',l);
    else if(l.startsWith('✔ ')) push(dev,'good',l);
    else if(l.startsWith('✖ ')) push(dev,'bad',l);
    else push(dev,'out',l);
  });
}
function executar(raw){
  const d=devAtual(), s=R.d[d.id];
  const c=raw.trim().replace(/\s+/g,' ');
  push(d.id,'cmd',[prompt_(d),c]);
  if(!c){desenha();return}
  R.hist.push(c); R.hp=R.hist.length;
  const lc=c.toLowerCase();
  if(lc==='ajuda'||lc==='?'||lc==='help'){saida(d.id,'Comandos de diagnóstico neste equipamento:'+nl+d.ajuda.map(a=>'  '+a).join(nl)+nl+'» Os comandos de correção você descobre investigando (ou pedindo dica).');desenha();return}
  if(lc==='cls'||lc==='clear'||lc==='limpar'){R.log[d.id]=[];desenha();return}
  let r=null;
  if(d.tipo==='ios'){
    const real=s.mode!=='exec'&&lc.startsWith('do ')?lc.slice(3):null;
    if(/^en(able)?$/.test(lc)) r='';
    else if(/^conf(ig(ure)?)?( t(erm(inal)?)?)?$/.test(lc)&&s.mode==='exec'){s.mode='conf';r='Enter configuration commands, one per line.  End with CNTL/Z.'+nl+'» Você entrou no modo de configuração global.'}
    else if(/^(int|interface) /.test(lc)&&s.mode!=='exec'){const f=normIf(lc.replace(/^(int|interface) /,''));if(!f)r='% Invalid input detected'+nl+'» Nome de interface inválido. Exemplo: interface gi1/0/12';else{s.mode='if';s.ifc=f;r='» Configurando a interface '+f+'.'}}
    else if(lc==='exit'){if(s.mode==='if'){s.mode='conf';s.ifc=null}else if(s.mode==='conf')s.mode='exec';r=''}
    else if(lc==='end'){s.mode='exec';s.ifc=null;r=''}
    else r=regra(d,real||lc,real?'exec':s.mode,s);
    if(r===null){
      const emExec=s.mode!=='exec'&&acha(d,lc,'exec');
      r=emExec?'% Invalid input detected'+nl+'» Esse é um comando de consulta. No modo de configuração use "do '+lc+'" ou saia com "end".':'% Invalid input detected at \'^\' marker.'+nl+'» Comando não reconhecido neste modo ('+(s.mode==='exec'?'privilegiado':s.mode==='conf'?'configuração':'interface '+s.ifc)+').';
    }
  }else{
    r=regra(d,lc,'any',s);
    if(r===null) r=d.tipo==='pc'?`'${c.split(' ')[0]}' não é reconhecido como um comando interno ou externo, um programa operável ou um arquivo em lotes.`+nl+'» Comando não reconhecido. Digite ajuda.':d.tipo==='linux'?`bash: comando não reconhecido`+nl+'» Digite ajuda.':'Command fail. Return code -61'+nl+'» Comando não reconhecido neste contexto. Digite ajuda.';
  }
  if(r&&typeof r==='object'){saida(d.id,r.o);if(r.solve)resolver()}
  else saida(d.id,r);
  desenha();
}
function acha(d,lc,mode){return d.regras.find(x=>(x.m||(d.tipo==='ios'?'exec':'any'))===mode&&x.r.test(lc))}
function regra(d,lc,mode,s){
  const x=acha(d,lc,mode); if(!x) return null;
  const m=lc.match(x.r);
  return x.f(R.st,m,s);
}
function resolver(){
  if(R.feito) return; R.feito=true;
  const est=Math.max(1,3-R.dicas);
  const ant=P[R.c.id]; P[R.c.id]={ok:1,est:Math.max(est,ant?ant.est:0)}; salvar();
  const c=R.c;
  $('deb').innerHTML=`<h2>Chamado resolvido</h2><div class="estrelas">${'★'.repeat(est)}${'☆'.repeat(3-est)} · ${R.dicas} dica(s) usada(s)</div>
  <h3>Causa raiz</h3><p>${c.causa}</p><h3>O conceito por trás</h3><p>${c.conceito}</p>
  <h3>Como explicar numa entrevista</h3><p class="fala">${c.fala}</p>
  ${R.i<CASOS.length-1?'<div><button class="btn" id="bProx" type="button">Próximo chamado</button></div>':'<p><b>Fila zerada.</b> Refaça os chamados sem dica até tirar 3 estrelas em todos.</p>'}`;
  $('deb').hidden=false; lista();
  const b=$('bProx'); if(b) b.onclick=()=>{abrir(R.i+1);window.scrollTo({top:0,behavior:'smooth'})};
  setTimeout(()=>$('deb').scrollIntoView({behavior:'smooth',block:'start'}),300);
}
function lista(){
  const ok=CASOS.filter(c=>P[c.id]).length;
  $('prog').innerHTML=`${ok} de ${CASOS.length} resolvidos<i><em style="width:${ok/CASOS.length*100}%"></em></i>`;
  $('lista').innerHTML=CASOS.map((c,i)=>`<li><button type="button" data-i="${i}" aria-current="${R&&R.i===i}"><span class="l1"><span class="pri ${c.pri.split(' ')[0]}">${c.pri.split(' ')[0]}</span>${c.area}${P[c.id]?`<span class="ok">${'★'.repeat(P[c.id].est)}</span>`:''}</span><span class="l2">${c.titulo}</span></button></li>`).join('');
  $('lista').querySelectorAll('button').forEach(b=>b.onclick=()=>abrir(+b.dataset.i));
}
function abas(){
  $('abas').innerHTML=R.c.devs.map(d=>`<button type="button" data-d="${d.id}" aria-pressed="${d.id===R.dev}">${d.nome}<small>${d.host}</small></button>`).join('');
  $('abas').querySelectorAll('button').forEach(b=>b.onclick=()=>{R.dev=b.dataset.d;abas();desenha();$('cmd').focus()});
}
function esc(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function desenha(){
  const d=devAtual();
  $('tela').innerHTML=R.log[d.id].map(([k,t])=>k==='cmd'?`<div><span class="pr">${esc(t[0])}</span> <span class="cmd">${esc(t[1])}</span></div>`:`<div class="${k}">${esc(t)||' '}</div>`).join('');
  $('tela').scrollTop=$('tela').scrollHeight;
  $('prompt').textContent=prompt_(d);
  $('chips').innerHTML='<span>atalhos:</span>'+d.ajuda.map(a=>`<button type="button">${esc(a)}</button>`).join('');
  $('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=b.textContent;$('cmd').value=v.replace(/<[^>]*>/g,'').replace(/\s+$/,'');$('cmd').focus()});
}
function atualizaDica(){
  const n=R.c.dicas.length;
  $('bDica').textContent=R.dicas<n?`Pedir dica (${n-R.dicas} restante${n-R.dicas>1?'s':''})`:'Sem mais dicas';
  $('bDica').disabled=R.dicas>=n;
}
$('bDica').onclick=()=>{
  if(R.dicas>=R.c.dicas.length) return;
  const t=R.c.dicas[R.dicas]; R.dicas++;
  $('dicas').insertAdjacentHTML('beforeend',`<div class="dica"><b>DICA ${R.dicas}</b>${t}</div>`);
  atualizaDica();
};
$('bReset').onclick=()=>abrir(R.i);
$('form').onsubmit=e=>{e.preventDefault();const v=$('cmd').value;$('cmd').value='';executar(v)};
$('cmd').addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'&&R.hp>0){R.hp--;$('cmd').value=R.hist[R.hp];e.preventDefault()}
  if(e.key==='ArrowDown'){R.hp=Math.min(R.hist.length,R.hp+1);$('cmd').value=R.hist[R.hp]||'';e.preventDefault()}
});
let ini=0; try{ini=+localStorage.getItem('plantao-ultimo')||0}catch(e){}
abrir(Math.min(ini,CASOS.length-1));
</script>
